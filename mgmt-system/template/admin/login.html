<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}} · MailHub</title>
    <script>
        (() => {
            const root = document.documentElement;
            const stored = localStorage.getItem('mailhub.theme');
            root.dataset.theme = stored === 'dark' || stored === 'light'
                ? stored
                : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            const brand = localStorage.getItem('mailhub.brandColor');
            if (/^#[0-9a-f]{6}$/i.test(brand || '')) root.style.setProperty('--saved-brand', brand);
        })();
    </script>
    <link rel="stylesheet" href="/static/login.css">
</head>
<body>
    <main class="login-shell">
        <section class="login-brand" aria-labelledby="brand-name">
            <div class="brand-lockup">
                <img src="/static/admin-app/mailhub.png" alt="" width="72" height="72">
                <div>
                    <h1 id="brand-name">MailHub</h1>
                    <p>邮件运维控制台</p>
                </div>
            </div>
            <div class="brand-context">
                <strong>邮件、节点与策略统一管理</strong>
                <span>系统状态 · 账号安全 · 可观测</span>
            </div>
        </section>

        <section class="login-workspace">
            <button class="theme-toggle" type="button" id="theme-toggle" aria-label="切换深浅主题" title="切换深浅主题">
                <span class="theme-icon-light" aria-hidden="true">☀</span>
                <span class="theme-icon-dark" aria-hidden="true">☾</span>
            </button>

            <div class="login-panel">
                <header class="login-header">
                    <span class="login-kicker">管理员入口</span>
                    <h2>管理后台登录</h2>
                    <p>使用管理员账号继续访问控制台</p>
                </header>

                {{if .error}}
                <div class="login-alert" role="alert">{{.error}}</div>
                {{end}}

                <form method="POST" action="/admin/login" id="login-form">
                    <input type="hidden" name="next" value="{{.next}}">
                    <div class="login-field">
                        <label for="username">用户名</label>
                        <input id="username" type="text" name="username" value="{{.username}}" placeholder="请输入管理员用户名" autocomplete="username" required {{if not .error}}autofocus{{end}} {{if not .initialized}}disabled{{end}}>
                    </div>
                    <div class="login-field">
                        <label for="password">密码</label>
                        <div class="password-control">
                            <input id="password" type="password" name="password" placeholder="请输入密码" autocomplete="current-password" required {{if .error}}autofocus{{end}} {{if not .initialized}}disabled{{end}}>
                            <button type="button" id="password-toggle" aria-label="显示密码" title="显示密码" {{if not .initialized}}disabled{{end}}>◉</button>
                        </div>
                    </div>
                    <button type="submit" class="login-submit" id="login-submit" {{if not .initialized}}disabled{{end}}>
                        <span class="login-spinner" aria-hidden="true"></span>
                        <span class="submit-label">登录控制台</span>
                    </button>
                </form>

                <p class="login-help">无法登录？请联系部署管理员通过恢复命令重置密码。</p>
                <p class="login-guard">仅限授权管理员访问</p>
            </div>
        </section>
    </main>
    <script src="/static/login.js" defer></script>
</body>
</html>
