server:
  port: 8080
  mode: release

database:
  driver: mysql
  # Compose injects the real DSN through MAILHUB_DATABASE_DSN.
  dsn: ""

auth:
  # Compose injects the real value through MAILHUB_SHARED_SECRET.
  shared_secret: ""
  admin_user: ""
  admin_pass: ""
  # 外部 API Token 在管理端“外部访问”页面签发，不写入部署配置。

domains:
  - name: example.com

default_retention_days: 30

filter:
  reload_interval: 30
  default_action: pass
  default_flag_subject_prefix: "[疑似]"
